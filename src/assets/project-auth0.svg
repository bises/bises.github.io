<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eb5424"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#fff" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
  </g>
  <!-- Shield icon (Auth0/security) -->
  <g transform="translate(400, 160)">
    <path d="M0-90 L70-50 L70 30 Q70 80 0 100 Q-70 80 -70 30 L-70-50 Z" fill="url(#accent)" opacity="0.9"/>
    <path d="M0-70 L50-38 L50 22 Q50 60 0 76 Q-50 60 -50 22 L-50-38 Z" fill="#1a1a2e" opacity="0.6"/>
    <path d="M-18 5 L-5 18 L22-10" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Ping Identity box (left) -->
  <g transform="translate(160, 160)">
    <rect x="-55" y="-35" width="110" height="70" rx="12" fill="#334155" opacity="0.8"/>
    <text x="0" y="-5" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">PING</text>
    <text x="0" y="12" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">IDENTITY</text>
  </g>
  <!-- Auth0 box (right) -->
  <g transform="translate(640, 160)">
    <rect x="-55" y="-35" width="110" height="70" rx="12" fill="url(#accent)" opacity="0.2"/>
    <rect x="-55" y="-35" width="110" height="70" rx="12" fill="none" stroke="#eb5424" stroke-width="2" opacity="0.6"/>
    <text x="0" y="-5" text-anchor="middle" fill="#eb5424" font-family="sans-serif" font-size="14" font-weight="700">Auth0</text>
    <text x="0" y="14" text-anchor="middle" fill="#f97316" font-family="sans-serif" font-size="10">by Okta</text>
  </g>
  <!-- Arrow left to center -->
  <g opacity="0.6">
    <line x1="220" y1="160" x2="310" y2="160" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="310,155 320,160 310,165" fill="#94a3b8"/>
  </g>
  <!-- Arrow center to right -->
  <g opacity="0.6">
    <line x1="480" y1="160" x2="575" y2="160" stroke="#eb5424" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="575,155 585,160 575,165" fill="#eb5424"/>
  </g>
  <!-- Label -->
  <text x="400" y="310" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="13" letter-spacing="3">IDENTITY MIGRATION</text>
  <!-- Floating dots decoration -->
  <circle cx="80" cy="60" r="4" fill="#eb5424" opacity="0.3"/>
  <circle cx="720" cy="80" r="6" fill="#3b82f6" opacity="0.2"/>
  <circle cx="150" cy="340" r="5" fill="#7c3aed" opacity="0.2"/>
  <circle cx="680" cy="330" r="3" fill="#f59e0b" opacity="0.3"/>
</svg>
