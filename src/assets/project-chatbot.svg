<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c1424"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Subtle dot grid -->
  <g fill="#334155" opacity="0.3">
    <circle cx="40" cy="40" r="1"/><circle cx="80" cy="40" r="1"/><circle cx="120" cy="40" r="1"/><circle cx="160" cy="40" r="1"/>
    <circle cx="200" cy="40" r="1"/><circle cx="240" cy="40" r="1"/><circle cx="280" cy="40" r="1"/><circle cx="320" cy="40" r="1"/>
    <circle cx="40" cy="80" r="1"/><circle cx="80" cy="80" r="1"/><circle cx="120" cy="80" r="1"/><circle cx="160" cy="80" r="1"/>
    <circle cx="200" cy="80" r="1"/><circle cx="240" cy="80" r="1"/><circle cx="280" cy="80" r="1"/><circle cx="320" cy="80" r="1"/>
    <circle cx="480" cy="320" r="1"/><circle cx="520" cy="320" r="1"/><circle cx="560" cy="320" r="1"/><circle cx="600" cy="320" r="1"/>
    <circle cx="640" cy="320" r="1"/><circle cx="680" cy="320" r="1"/><circle cx="720" cy="320" r="1"/><circle cx="760" cy="320" r="1"/>
    <circle cx="480" cy="360" r="1"/><circle cx="520" cy="360" r="1"/><circle cx="560" cy="360" r="1"/><circle cx="600" cy="360" r="1"/>
    <circle cx="640" cy="360" r="1"/><circle cx="680" cy="360" r="1"/><circle cx="720" cy="360" r="1"/><circle cx="760" cy="360" r="1"/>
  </g>
  <!-- Chat window frame -->
  <g transform="translate(190, 40)">
    <rect x="0" y="0" width="420" height="300" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="420" height="40" rx="16" fill="#1e293b"/>
    <rect x="0" y="20" width="420" height="20" fill="#1e293b"/>
    <circle cx="24" cy="20" r="5" fill="#ef4444" opacity="0.7"/>
    <circle cx="44" cy="20" r="5" fill="#f59e0b" opacity="0.7"/>
    <circle cx="64" cy="20" r="5" fill="#22c55e" opacity="0.7"/>
    <text x="210" y="24" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="600">Identity Chatbot</text>
    <line x1="0" y1="40" x2="420" y2="40" stroke="#334155" stroke-width="1"/>
    <!-- User message -->
    <g transform="translate(200, 65)">
      <rect x="0" y="0" width="200" height="36" rx="12" fill="url(#accent)"/>
      <text x="16" y="22" fill="#fff" font-family="sans-serif" font-size="11">Show me user login history</text>
    </g>
    <!-- Bot message -->
    <g transform="translate(20, 115)">
      <rect x="0" y="0" width="280" height="70" rx="12" fill="#0f172a"/>
      <text x="16" y="20" fill="#94a3b8" font-family="sans-serif" font-size="11">Found 147 login events for user</text>
      <text x="16" y="36" fill="#94a3b8" font-family="sans-serif" font-size="11">across 3 applications. Last login:</text>
      <text x="16" y="55" fill="#22c55e" font-family="monospace" font-size="10">✓ auth0 | 2 min ago | web-app</text>
    </g>
    <!-- User message 2 -->
    <g transform="translate(150, 200)">
      <rect x="0" y="0" width="250" height="36" rx="12" fill="url(#accent)"/>
      <text x="16" y="22" fill="#fff" font-family="sans-serif" font-size="11">Check for suspicious activity</text>
    </g>
    <!-- Bot typing indicator -->
    <g transform="translate(20, 250)">
      <rect x="0" y="0" width="80" height="30" rx="12" fill="#0f172a"/>
      <circle cx="22" cy="15" r="4" fill="#64748b" opacity="0.4">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="38" cy="15" r="4" fill="#64748b" opacity="0.4">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="54" cy="15" r="4" fill="#64748b" opacity="0.4">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <!-- RBAC badge -->
  <g transform="translate(670, 80)">
    <rect x="-35" y="-14" width="70" height="28" rx="14" fill="#7c3aed" opacity="0.2"/>
    <rect x="-35" y="-14" width="70" height="28" rx="14" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="700">RBAC</text>
  </g>
  <!-- Lock icon -->
  <g transform="translate(670, 140)">
    <rect x="-14" y="-3" width="28" height="22" rx="4" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
    <path d="M-8-3 L-8-10 Q-8-18 0-18 Q8-18 8-10 L8-3" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="8" r="2" fill="#f59e0b" opacity="0.5"/>
  </g>
  <!-- AI sparkle -->
  <g transform="translate(115, 180)" fill="#3b82f6" opacity="0.3">
    <path d="M0-12 L3-3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3-3 Z"/>
  </g>
  <g transform="translate(700, 280)" fill="#2563eb" opacity="0.2">
    <path d="M0-8 L2-2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2-2 Z"/>
  </g>
  <!-- Label -->
  <text x="400" y="378" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="13" letter-spacing="3">AI-POWERED IDENTITY ASSISTANT</text>
</svg>
