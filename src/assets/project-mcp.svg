<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Radial glow -->
  <circle cx="400" cy="200" r="180" fill="url(#glow)"/>
  <!-- Grid -->
  <g opacity="0.04" stroke="#a78bfa" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/>
  </g>
  <!-- Central server -->
  <g transform="translate(400, 170)">
    <rect x="-50" y="-65" width="100" height="130" rx="10" fill="#1e293b" stroke="#7c3aed" stroke-width="2"/>
    <rect x="-35" y="-50" width="70" height="12" rx="3" fill="#334155"/>
    <circle cx="25" cy="-44" r="3" fill="#22c55e"/>
    <rect x="-35" y="-30" width="70" height="12" rx="3" fill="#334155"/>
    <circle cx="25" cy="-24" r="3" fill="#22c55e"/>
    <rect x="-35" y="-10" width="70" height="12" rx="3" fill="#334155"/>
    <circle cx="25" cy="-4" r="3" fill="#7c3aed"/>
    <rect x="-35" y="10" width="70" height="12" rx="3" fill="#334155"/>
    <circle cx="25" cy="16" r="3" fill="#7c3aed"/>
    <!-- MCP label -->
    <rect x="-30" y="32" width="60" height="22" rx="4" fill="url(#accent)"/>
    <text x="0" y="47" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11" font-weight="700">MCP</text>
  </g>
  <!-- Left: AI Agent -->
  <g transform="translate(160, 140)">
    <rect x="-50" y="-30" width="100" height="60" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" opacity="0.8"/>
    <text x="0" y="-5" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="600">AI Agent</text>
    <text x="0" y="12" text-anchor="middle" fill="#475569" font-family="monospace" font-size="9">tools.call()</text>
  </g>
  <!-- Right: Identity API -->
  <g transform="translate(640, 140)">
    <rect x="-55" y="-30" width="110" height="60" rx="10" fill="#1e293b" stroke="#eb5424" stroke-width="1.5" opacity="0.8"/>
    <text x="0" y="-5" text-anchor="middle" fill="#f97316" font-family="sans-serif" font-size="11" font-weight="600">Identity API</text>
    <text x="0" y="12" text-anchor="middle" fill="#475569" font-family="monospace" font-size="9">Auth0 / RBAC</text>
  </g>
  <!-- Left: Log Aggregator -->
  <g transform="translate(160, 240)">
    <rect x="-50" y="-25" width="100" height="50" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" opacity="0.8"/>
    <text x="0" y="-2" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="600">Logs</text>
    <text x="0" y="13" text-anchor="middle" fill="#475569" font-family="monospace" font-size="9">aggregation</text>
  </g>
  <!-- Right: Security -->
  <g transform="translate(640, 240)">
    <rect x="-50" y="-25" width="100" height="50" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" opacity="0.8"/>
    <text x="0" y="-2" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="600">Security</text>
    <text x="0" y="13" text-anchor="middle" fill="#475569" font-family="monospace" font-size="9">analysis</text>
  </g>
  <!-- Connections -->
  <g stroke-width="1.5" fill="none" stroke-dasharray="5,3">
    <line x1="215" y1="145" x2="345" y2="165" stroke="#3b82f6" opacity="0.5"/>
    <line x1="455" y1="155" x2="580" y2="145" stroke="#eb5424" opacity="0.5"/>
    <line x1="215" y1="238" x2="345" y2="200" stroke="#22c55e" opacity="0.5"/>
    <line x1="455" y1="200" x2="585" y2="238" stroke="#f59e0b" opacity="0.5"/>
  </g>
  <!-- Data flow particles -->
  <circle cx="280" cy="155" r="3" fill="#3b82f6" opacity="0.7"><animate attributeName="cx" values="215;345" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="150" r="3" fill="#eb5424" opacity="0.7"><animate attributeName="cx" values="455;580" dur="2.5s" repeatCount="indefinite"/></circle>
  <!-- Label -->
  <text x="400" y="345" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="13" letter-spacing="3">MODEL CONTEXT PROTOCOL</text>
  <!-- Floating dots -->
  <circle cx="60" cy="50" r="3" fill="#7c3aed" opacity="0.4"/>
  <circle cx="740" cy="70" r="5" fill="#3b82f6" opacity="0.2"/>
  <circle cx="100" cy="350" r="4" fill="#22c55e" opacity="0.2"/>
</svg>
