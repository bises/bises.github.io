<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1c1217"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.04" stroke="#f59e0b" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
  </g>
  <!-- Dashboard frame -->
  <g transform="translate(160, 50)">
    <rect x="0" y="0" width="480" height="280" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="480" height="36" rx="14" fill="#1e293b"/>
    <rect x="0" y="16" width="480" height="20" fill="#1e293b"/>
    <circle cx="20" cy="18" r="4" fill="#ef4444" opacity="0.6"/>
    <circle cx="36" cy="18" r="4" fill="#f59e0b" opacity="0.6"/>
    <circle cx="52" cy="18" r="4" fill="#22c55e" opacity="0.6"/>
    <text x="240" y="22" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">Rewards Dashboard</text>
    <line x1="0" y1="36" x2="480" y2="36" stroke="#334155" stroke-width="1"/>
    <!-- Stats row -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="135" height="55" rx="8" fill="#0f172a"/>
      <text x="14" y="20" fill="#64748b" font-family="sans-serif" font-size="9">Active Users</text>
      <text x="14" y="42" fill="#f59e0b" font-family="sans-serif" font-size="20" font-weight="700">12.4k</text>
    </g>
    <g transform="translate(170, 50)">
      <rect x="0" y="0" width="135" height="55" rx="8" fill="#0f172a"/>
      <text x="14" y="20" fill="#64748b" font-family="sans-serif" font-size="9">Points Earned</text>
      <text x="14" y="42" fill="#22c55e" font-family="sans-serif" font-size="20" font-weight="700">854k</text>
    </g>
    <g transform="translate(320, 50)">
      <rect x="0" y="0" width="140" height="55" rx="8" fill="#0f172a"/>
      <text x="14" y="20" fill="#64748b" font-family="sans-serif" font-size="9">Conversion</text>
      <text x="14" y="42" fill="#3b82f6" font-family="sans-serif" font-size="20" font-weight="700">+23%</text>
    </g>
    <!-- Bar chart -->
    <g transform="translate(30, 130)">
      <text x="0" y="0" fill="#64748b" font-family="sans-serif" font-size="9">Engagement by Action</text>
      <!-- Bars -->
      <rect x="0" y="15" width="280" height="20" rx="4" fill="#0f172a"/>
      <rect x="0" y="15" width="250" height="20" rx="4" fill="url(#bar)" opacity="0.8"/>
      <text x="260" y="30" fill="#f59e0b" font-family="sans-serif" font-size="9">Auto-pay</text>

      <rect x="0" y="42" width="280" height="20" rx="4" fill="#0f172a"/>
      <rect x="0" y="42" width="190" height="20" rx="4" fill="url(#bar)" opacity="0.6"/>
      <text x="200" y="57" fill="#f59e0b" font-family="sans-serif" font-size="9">Content</text>

      <rect x="0" y="69" width="280" height="20" rx="4" fill="#0f172a"/>
      <rect x="0" y="69" width="140" height="20" rx="4" fill="url(#bar)" opacity="0.4"/>
      <text x="150" y="84" fill="#f59e0b" font-family="sans-serif" font-size="9">Referral</text>
    </g>
    <!-- Trend line -->
    <g transform="translate(340, 130)">
      <text x="0" y="0" fill="#64748b" font-family="sans-serif" font-size="9">Retention Trend</text>
      <polyline points="0,80 20,70 40,75 60,55 80,45 100,48 120,30" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
      <circle cx="120" cy="30" r="3" fill="#22c55e"/>
    </g>
  </g>
  <!-- Star decorations -->
  <g transform="translate(700, 100)" fill="#f59e0b" opacity="0.15">
    <polygon points="0,-20 5,-7 18,-7 8,2 12,16 0,8 -12,16 -8,2 -18,-7 -5,-7"/>
  </g>
  <g transform="translate(720, 260)" fill="#f59e0b" opacity="0.1">
    <polygon points="0,-14 4,-5 13,-5 6,1 8,11 0,6 -8,11 -6,1 -13,-5 -4,-5"/>
  </g>
  <!-- Label -->
  <text x="400" y="370" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="13" letter-spacing="3">CLIENT REWARDS &amp; ENGAGEMENT</text>
</svg>
