<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c1e2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.04" stroke="#0ea5e9" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
  </g>
  <!-- Central component block -->
  <g transform="translate(400, 175)">
    <rect x="-70" y="-50" width="140" height="100" rx="14" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
    <text x="0" y="-18" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">&lt;rm-header/&gt;</text>
    <text x="0" y="2" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">&lt;rm-footer/&gt;</text>
    <line x1="-50" y1="18" x2="50" y2="18" stroke="#334155" stroke-width="1"/>
    <text x="0" y="36" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="9">Web Components</text>
  </g>
  <!-- App 1 (top-left) -->
  <g transform="translate(140, 100)">
    <rect x="-55" y="-30" width="110" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="0" y="-5" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Servicing App</text>
    <text x="0" y="12" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">Angular</text>
  </g>
  <!-- App 2 (bottom-left) -->
  <g transform="translate(140, 260)">
    <rect x="-55" y="-30" width="110" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="0" y="-5" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Rewards App</text>
    <text x="0" y="12" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">React</text>
  </g>
  <!-- App 3 (top-right) -->
  <g transform="translate(660, 100)">
    <rect x="-55" y="-30" width="110" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="0" y="-5" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Marketing</text>
    <text x="0" y="12" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">Next.js</text>
  </g>
  <!-- App 4 (bottom-right) -->
  <g transform="translate(660, 260)">
    <rect x="-55" y="-30" width="110" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="0" y="-5" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Partner Portal</text>
    <text x="0" y="12" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">Angular</text>
  </g>
  <!-- Connection lines -->
  <g stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.4" fill="none">
    <line x1="200" y1="105" x2="325" y2="155"/>
    <line x1="200" y1="255" x2="325" y2="200"/>
    <line x1="600" y1="105" x2="475" y2="155"/>
    <line x1="600" y1="255" x2="475" y2="200"/>
  </g>
  <!-- SSR badge -->
  <g transform="translate(400, 300)">
    <rect x="-25" y="-12" width="50" height="24" rx="12" fill="#0ea5e9" opacity="0.15"/>
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">SSR</text>
  </g>
  <!-- Label -->
  <text x="400" y="370" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="13" letter-spacing="3">SHARED WEB COMPONENTS</text>
  <!-- Floating dots -->
  <circle cx="60" cy="50" r="3" fill="#0ea5e9" opacity="0.3"/>
  <circle cx="740" cy="350" r="4" fill="#0ea5e9" opacity="0.2"/>
</svg>
